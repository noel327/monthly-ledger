<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>月結簿</title>
<meta name="theme-color" content="#1c6a55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="月結簿">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a household ledger with two books — income is pooled at the top of the month, split into 屋企帳 and 個人帳, then each book is ticked off line by line */
:root{
  --bg:#f2f4f3; --surface:#ffffff; --sunk:#e8ecea; --ink:#16201c; --muted:#5b6964; --line:#d7dfdb;
  --accent:#1c6a55; --accent-ink:#ffffff; --accent-soft:#dfeee8;
  --home:#2f5d8a; --home-soft:#e2ebf4; --self:#8a4f2f; --self-soft:#f4e8e1;
  --ok:#2b7a4b; --warn:#a86300; --crit:#b3261e; --warn-soft:#fbefdc; --crit-soft:#f9e1df;
  --f-sans:"IBM Plex Sans","Noto Sans TC","PingFang HK","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1412; --surface:#171e1b; --sunk:#121816; --ink:#e4ebe8; --muted:#97a6a0; --line:#28332f;
  --accent:#5fc3a4; --accent-ink:#0b1512; --accent-soft:#1a2d27;
  --home:#86b4e0; --home-soft:#1a2633; --self:#e0a583; --self-soft:#2e2019;
  --ok:#62c08a; --warn:#e3a640; --crit:#f07068; --warn-soft:#2e2414; --crit-soft:#33191a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1412; --surface:#171e1b; --sunk:#121816; --ink:#e4ebe8; --muted:#97a6a0; --line:#28332f;
  --accent:#5fc3a4; --accent-ink:#0b1512; --accent-soft:#1a2d27;
  --home:#86b4e0; --home-soft:#1a2633; --self:#e0a583; --self-soft:#2e2019;
  --ok:#62c08a; --warn:#e3a640; --crit:#f07068; --warn-soft:#2e2414; --crit-soft:#33191a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1080px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:24px;font-weight:700;letter-spacing:.02em}
.brand span{color:var(--muted);font-size:13px}
.save{font-size:12.5px;color:var(--muted)}
.save b{color:var(--ok);font-weight:500}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 15px;border-radius:999px;color:var(--muted);font-weight:500}
.seg button[aria-current="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

.note,.bar{border:1px solid var(--line);background:var(--warn-soft);color:var(--ink);padding:10px 14px;border-radius:var(--r);font-size:14px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bar .btn{padding:5px 12px;font-size:13px}

.mbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mbar h2{font-size:22px;font-weight:600;min-width:9ch}
.mbar .sub{color:var(--muted);font-size:14px}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px;line-height:1}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}

/* book switch */
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.books button{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:12px 16px;border-left-width:5px}
.books button[data-b="home"]{border-left-color:var(--home)}
.books button[data-b="self"]{border-left-color:var(--self)}
.books button b{font-size:16px;font-weight:600}
.books button small{display:block;color:var(--muted);font-size:12.5px}
.books button .num{font-size:17px;font-weight:600}
.books button[aria-current="true"][data-b="home"]{background:var(--home-soft);border-color:var(--home)}
.books button[aria-current="true"][data-b="self"]{background:var(--self-soft);border-color:var(--self)}
.tag{font-size:11.5px;padding:2px 8px;border-radius:999px;font-weight:500;white-space:nowrap}
.tag.home{background:var(--home-soft);color:var(--home)}
.tag.self{background:var(--self-soft);color:var(--self)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat .lbl{font-size:12px;letter-spacing:.06em;color:var(--muted)}
.stat .val{font-size:21px;font-weight:600;font-family:var(--f-num);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .foot{font-size:12.5px;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter i.warn{background:var(--warn)} .meter i.crit{background:var(--crit)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheet>.hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sheet>.hd h3{font-size:16px;font-weight:600}
.sheet>.hd .sum{color:var(--muted);font-size:13.5px}
.sheet>.bd{padding:14px 18px}
.empty{padding:20px 18px;color:var(--muted);font-size:14px;margin:0}

/* income split */
.split{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:stretch;padding:16px 18px;background:var(--sunk);border-top:1px solid var(--line)}
.pot{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pot .lbl{font-size:12px;color:var(--muted);letter-spacing:.05em}
.pot .val{font-family:var(--f-num);font-size:20px;font-weight:600}
.pot.home{border-left:4px solid var(--home)} .pot.self{border-left:4px solid var(--self)}
.pot label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.pot input[type=checkbox]{accent-color:var(--accent)}
.arrow{align-self:center;color:var(--muted);font-size:20px}

.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 128px 34px;align-items:center;gap:12px;padding:11px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .nm b{font-weight:500;display:block;overflow-wrap:anywhere}
.row .nm small{color:var(--muted);font-size:12.5px;display:block;overflow-wrap:anywhere}
.row.done .nm b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.chk input{width:20px;height:20px;accent-color:var(--accent);margin:0;cursor:pointer}
.amt{width:100%;text-align:right;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 9px;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.pot .amt{background:var(--surface);font-size:18px;font-weight:600}
.row.done .amt{background:transparent;border-color:transparent;color:var(--muted)}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.pill.late{background:var(--crit-soft);color:var(--crit);border-color:transparent;font-weight:500}
.pill.soon{background:var(--warn-soft);color:var(--warn);border-color:transparent;font-weight:500}
.pill.ok{background:var(--accent-soft);color:var(--ok);border-color:transparent}
.x{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:6px;font-size:15px}
.x:hover{background:var(--sunk);color:var(--crit)}
.x.armed{color:var(--crit);font-size:12px;width:auto;padding:0 6px;background:var(--crit-soft)}

.addline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:12px 18px;background:var(--sunk);border-top:1px solid var(--line)}
.addline input,.addline select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;min-width:0}
.addline .grow{flex:1 1 180px}
.addline .w-s{width:90px}.addline .w-m{width:130px}
.addline label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:7px 14px;font-weight:600}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.sm{padding:5px 11px;font-size:13px}
.btn.danger{background:var(--surface);color:var(--crit);border:1px solid var(--line);font-weight:500}

.grid2{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px}
.bud{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px}
.bud .barx{height:10px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.bud .barx i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px}
.bud .barx i.over{background:var(--crit)} .bud .barx i.near{background:var(--warn)}
.bud .v{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.bud .v em{font-style:normal;color:var(--muted)}
.bud .tot{font-weight:600;border-top:1px solid var(--line);padding-top:8px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .b{fill:var(--accent);opacity:.45} .chart .b.cur{opacity:1}
.chart .bl{fill:var(--ink);font-weight:600}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.05em;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td input,td select{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 7px;width:100%;min-width:0}
td input:hover,td select:hover{border-color:var(--line)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--sunk);outline:none}
td input[type=checkbox]{width:auto}
td.r,th.r{text-align:right}
td.r input{text-align:right;font-family:var(--f-num)}
.kind{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}

/* subscriptions */
.subs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.subc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0}
.subc.st-decide,.subc.st-over{border-color:var(--warn);box-shadow:inset 4px 0 0 var(--warn)}
.subc.st-ended{opacity:.7}
.subc .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.subc .h b{font-size:16px;font-weight:600;margin-right:auto;overflow-wrap:anywhere}
.subc .price{font-family:var(--f-num);font-size:15px}
.subc .price span{color:var(--muted);font-family:var(--f-sans);font-size:13px}
.subc .prog{display:flex;align-items:center;gap:10px}
.subc .prog .meter{flex:1;margin:0;height:8px}
.subc .prog span{font-size:13px;white-space:nowrap}
.subc dl{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:0;font-size:13.5px}
.subc dt{color:var(--muted)} .sub dd{margin:0;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.subc .advice{margin:0;font-size:13.5px;padding:8px 10px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}
.subc .advice.calm{background:var(--sunk);color:var(--muted)}
.subc .acts{display:flex;gap:8px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px;padding:16px 18px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.form input,.form select{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:7px 9px;color:var(--ink);font-size:14px;min-width:0}
.form .wide{grid-column:span 2}
.form .chkl{flex-direction:row;align-items:center;gap:8px;align-self:end;padding-bottom:8px}
.form .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}

.onboard{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:12px;max-width:640px}
.onboard h3{font-size:19px}
.onboard p{margin:0;color:var(--muted);max-width:60ch}
.hint{color:var(--muted);font-size:13px;margin:0}
.hint.pad{padding:10px 18px}

@media (max-width:820px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2,.subs{grid-template-columns:minmax(0,1fr)}
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .split .arrow{display:none}
  .split .pot:first-child{grid-column:1/-1}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .row{grid-template-columns:28px minmax(0,1fr) auto;padding:11px 14px}
  .row .amt{grid-column:2/3}
  .row .x{grid-column:3/4}
  .seg button{padding:7px 10px}
  .stat .val{font-size:18px}
  .books{grid-template-columns:1fr 1fr}
  .books button{flex-direction:column;align-items:flex-start;padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gate{min-height:80vh;display:grid;place-items:center}
.gate-card{display:grid;gap:14px;justify-items:start;max-width:380px}
.gate-card h1{font-size:28px}
.gate-card p{margin:0;color:var(--muted)}
.acct{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.acct button{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:12.5px}
</style>
</head>
<body>
<div class="gate" id="gate" hidden>
  <div class="gate-card">
    <h1>月結簿</h1>
    <p id="gateMsg">用你個 Google 帳戶登入，就可以喺電話同電腦睇同一本帳。</p>
    <button class="btn" id="signIn" type="button">用 Google 登入</button>
  </div>
</div>
<div class="wrap" id="shell">
  <header class="top">
    <div class="brand"><h1>月結簿</h1><span>屋企帳 · 個人帳</span><span class="save" id="savestat"></span></div>
    <div class="acct"><span id="who"></span><button id="signOut" type="button">登出</button></div>
    <nav class="seg" id="tabs">
      <button data-act="tab" data-tab="plan">月頭清單</button>
      <button data-act="tab" data-tab="review">月結總結</button>
      <button data-act="tab" data-tab="subs">訂閱管理</button>
      <button data-act="tab" data-tab="settings">設定</button>
    </nav>
  </header>
  <div id="note" class="note" hidden></div>
  <div id="filebar" class="bar" hidden></div>
  <main id="app" class="wrap"><p class="hint">載入緊你嘅帳簿…</p></main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>{n=Math.round((+n||0)*100)/100;return (n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-HK',{maximumFractionDigits:2})};
const gid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,'0');
const ymOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const addM=(ym,n)=>{const[y,m]=ym.split('-').map(Number);return ymOf(new Date(y,m-1+n,1))};
const ymLabel=ym=>{const[y,m]=ym.split('-');return `${y}年${+m}月`};
const daysIn=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()};
const clone=o=>JSON.parse(JSON.stringify(o));
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const now=new Date(), TODAY_YM=ymOf(now), TODAY_D=now.getDate();
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const isoToday=()=>iso(new Date());
const pD=s=>{if(!s)return null;const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d||1)};
const today0=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const addMD=(d,n)=>{const y=d.getFullYear(),m=d.getMonth()+n,day=d.getDate();const last=new Date(y,m+1,0).getDate();return new Date(y,m,Math.min(day,last))};
const mDiff=(a,b)=>(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth())-(b.getDate()<a.getDate()?1:0);
const dDiff=(a,b)=>Math.round((b-a)/864e5);
const dLabel=d=>d?`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`:'—';

const BOOKS={home:'屋企帳',self:'個人帳'};
const KIND={bill:'要俾',transfer:'過數'};
const DEFAULT_CATS=[
  ['c-h-food','食材/乾糧','home'],['c-h-out','外賣/外食','home'],['c-h-daily','日用品','home'],['c-h-util','水電煤/網絡','home'],
  ['c-h-pet','寵物','home'],['c-h-car','隧道費/泊車','home'],['c-h-rent','住屋','home'],['c-h-other','屋企其他','home'],
  ['c-s-eat','飲食','self'],['c-s-trans','交通','self'],['c-s-sub','訂閱服務','self'],['c-s-shop','購物','self'],
  ['c-s-fun','娛樂','self'],['c-s-loan','還款','self'],['c-s-other','個人其他','self']].map(([id,name,book])=>({id,name,book,budget:0}));

let view='plan', book='home', planM=TODAY_YM, revM=addM(TODAY_YM,-1), editSub=null;
let S={settings:null,months:{}}, mode='loading', loaded=false;
const armed=new Set();
try{const v=localStorage.getItem('yjb-view');if(['plan','review','subs','settings'].includes(v))view=v;
  const b=localStorage.getItem('yjb-book');if(b in BOOKS)book=b}catch(e){}

/* ---------- data model ---------- */
function norm(src){
  const s=clone(src||{});
  s.categories=s.categories&&s.categories.length?s.categories:clone(DEFAULT_CATS);
  s.categories.forEach(c=>{if(!(c.book in BOOKS))c.book=c.group==='屋企'?'home':'self'});
  s.items=s.items||[]; s.subs=s.subs||[];
  if(!Array.isArray(s.incomes))s.incomes=[{id:'i-me',name:'我嘅收入',day:1,amount:0},{id:'i-bf',name:'男朋友俾嘅錢',day:1,amount:0}];

function subInfo(sub){
  const t=today0(), since=pD(sub.since||sub.start), start=pD(sub.start||sub.since);
  if(!start)return{st:'active',label:'未填開始日'};
  const term=+sub.term||0, notice=sub.notice==null?30:+sub.notice;
  const cancel=pD(sub.cancelled);
  const totalM=Math.max(0,mDiff(since,t)+1), curM=Math.max(1,mDiff(start,t)+1);
  const yearly=sub.cycle==='year';
  let next=null;
  if(!(cancel&&cancel<t)&&since<=t){let k=0;while(true){const d=addMD(since,yearly?12*k:k);if(d>=t){next=d;break}k++;if(k>600)break}}
  else if(since>t)next=since;
  const paid=(+sub.amount||0)*(since>t?0:(yearly?Math.floor(mDiff(since,t)/12)+1:totalM));
  const r={totalM,curM,next,paid,term,since,start};
  if(cancel&&cancel<t)return{...r,st:'ended',label:'已取消',advice:`已喺 ${dLabel(cancel)} 取消。`};
  if(since>t)return{...r,st:'future',label:'未開始',advice:`${dLabel(since)} 開始。`};
  if(term>0){
    const end=addMD(start,term);end.setDate(end.getDate()-1);
    const left=dDiff(t,end), remind=new Date(end);remind.setDate(remind.getDate()-notice);
    r.end=end;r.left=left;r.pct=Math.min(100,curM/term*100);
    if(cancel)return{...r,st:'cancelling',label:'已安排取消',advice:`會喺 ${dLabel(cancel)} 停止，之後唔使再俾。`};
    if(left<0){const over=Math.max(1,mDiff(end,t));return{...r,st:'over',label:'合約已完',advice:`合約喺 ${dLabel(end)} 完咗，而家按月續緊（已過約 ${over} 個月）。要決定續約定取消。`}}
    if(t>=remind)return{...r,st:'decide',label:'要決定',advice:`仲有 ${left} 日合約完（${dLabel(end)}）。要提早 ${notice} 日通知，即係而家要決定續約定取消。`};
    return{...r,st:'active',label:'合約中',advice:`${dLabel(remind)} 開始要考慮續約定取消（合約完前 ${notice} 日）。`,calm:true};
  }
  if(cancel)return{...r,st:'cancelling',label:'已安排取消',advice:`會喺 ${dLabel(cancel)} 停止。`};
  return{...r,st:'active',label:'無約按月',advice:'冇合約期，隨時可以取消。',calm:true};
}
function subItems(ym,bk){
  const out=[];
  getSettings().subs.forEach(sb=>{
    if(!sb.inList||bookOf(sb)!==bk)return;
    const since=pD(sb.since||sb.start);if(!since)return;
    const sYm=ymOf(since);if(sYm>ym)return;
    if(sb.cancelled&&ymOf(pD(sb.cancelled))<ym)return;
    if(sb.cycle==='year'&&sYm.slice(5)!==ym.slice(5))return;
    out.push({id:'sub-'+sb.id,name:sb.name,kind:'bill',day:since.getDate(),amount:+sb.amount||0,cat:sb.cat,acct:sb.acct,book:bk,src:'sub'});
  });
  return out;
}
function monthItems(ym,bk){
  const s=getSettings(),m=getMonth(ym),ck=m.checks||{};
  const tpl=s.items.filter(i=>i.active!==false&&(!i.from||i.from<=ym)&&i.book===bk).map(i=>({...i,src:'tpl'}));
  const ex=(m.extras||[]).filter(i=>bookOf(i)===bk).map(i=>({...i,src:'extra'}));
  return tpl.concat(subItems(ym,bk),ex).map(i=>{const c=ck[i.id];return{...i,check:c,amt:(c&&c.amount!=null)?c.amount:(+i.amount||0)}})
    .sort((a,b)=>(a.day||0)-(b.day||0));
}
function incomes(ym){
  const s=getSettings(),m=getMonth(ym),ic=m.inc||{};
  return s.incomes.filter(i=>!i.from||i.from<=ym).map(i=>{const c=ic[i.id];return{...i,check:c,amt:(c&&c.amount!=null)?c.amount:(+i.amount||0)}})
    .sort((a,b)=>(a.day||0)-(b.day||0));
}
const allocOf=ym=>{const m=getMonth(ym);return m.alloc!=null?+m.alloc:(+getSettings().homeAlloc||0)};
function calc(ym){
  const m=getMonth(ym), inc=incomes(ym), incTot=sum(inc,i=>i.amt), alloc=allocOf(ym);
  const out={incTot,incGot:sum(inc.filter(i=>i.check&&i.check.done),i=>i.amt),incN:inc.length,incDone:inc.filter(i=>i.check&&i.check.done).length,alloc,has:!!S.months[ym]};
  for(const bk of Object.keys(BOOKS)){
    const items=monthItems(ym,bk), ents=(m.entries||[]).filter(e=>bookOf(e)===bk);
    let exp=0,trf=0,extra=0;const byCat={};const add=(c,a)=>{byCat[c]=(byCat[c]||0)+a};
    items.forEach(it=>{if(!(it.check&&it.check.done))return;const a=+it.amt||0;if(it.kind==='bill'){exp+=a;add(it.cat,a)}else trf+=a});
    ents.forEach(e=>{const a=+e.amount||0;if(e.type==='inc')extra+=a;else{exp+=a;add(e.cat,a)}});
    const avail=(bk==='home'?alloc:incTot-alloc)+extra;
    out[bk]={items,ents,exp,trf,extra,byCat,avail,due:sum(items,i=>i.amt),open:items.filter(i=>!(i.check&&i.check.done))};
  }
  return out;
}

function chart(){
  const ms=[];for(let k=5;k>=0;k--)ms.push(addM(revM,-k));
  const vals=ms.map(m=>calc(m)[book].exp), max=Math.max(...vals,1);
  const step=niceStep(max/4), top=Math.ceil(max/step)*step||1;
  const W=520,H=220,L=56,R=10,T=14,B=30,cw=(W-L-R)/ms.length,bw=Math.min(46,cw*.56);
  const y=v=>T+(H-T-B)*(1-v/top);let g='';
  for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`;
  ms.forEach((m,i)=>{const x=L+cw*i+(cw-bw)/2,v=vals[i],cur=m===revM;
    if(v>0)g+=`<rect class="b ${cur?'cur':''}" x="${x}" y="${y(v)}" width="${bw}" height="${y(0)-y(v)}" rx="3"/>`;
    if(cur&&v>0)g+=`<text class="bl" x="${x+bw/2}" y="${y(v)-5}" text-anchor="middle">${short(v)}</text>`;
    g+=`<text x="${x+bw/2}" y="${H-10}" text-anchor="middle">${+m.split('-')[1]}月</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="近 6 個月支出">${g}</svg>`;
}
const niceStep=r=>{if(r<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(r))),f=r/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p};
const short=v=>v>=1e4?(v/1e3).toFixed(v%1e3?1:0)+'k':Math.round(v).toLocaleString('en-HK');

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT'||b.tagName==='SELECT')return;
  const a=b.dataset.act,id=b.dataset.id;
  if(storageAct(a))return;
  if(a==='tab'){view=b.dataset.tab;editSub=null;try{localStorage.setItem('yjb-view',view)}catch(err){}render();return}
  if(a==='book'){book=b.dataset.b;try{localStorage.setItem('yjb-book',book)}catch(err){}render();return}
  if(a==='nav'){const d=+b.dataset.d;if(b.dataset.w==='plan')planM=d?addM(planM,d):TODAY_YM;else revM=d?addM(revM,d):addM(TODAY_YM,-1);render();return}
  if(a==='import'){$('#imp').click();return}
  if(a==='seed'){const s=norm(null);
    S.settings=s;persist('settings',s);view='settings';render();return}
  if(a==='addItem'){editSettings(s=>{s.items.push({id:gid(),name:'新項目',kind:'bill',day:1,amount:0,cat:'',acct:'',active:true,from:TODAY_YM,book})});render();return}
  if(a==='addCat'){editSettings(s=>{s.categories.push({id:'c-'+gid(),name:'新分類',book,budget:0})});render();return}
  if(a==='addInc'){editSettings(s=>{s.incomes.push({id:'i-'+gid(),name:'新收入',day:1,amount:0,from:TODAY_YM})});render();return}
  if(a==='subEdit'){editSub=id;render();const f=$('#subform');if(f)f.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(a==='subEditCancel'){editSub=null;render();return}
  if(a==='subUndo'){editSettings(s=>{const x=s.subs.find(v=>v.id===id);if(x)x.cancelled=''});render();return}
  if(a==='subRenew'||a==='subCancel'){
    const k=a+':'+id;
    if(!armed.has(k)){armed.add(k);render();setTimeout(()=>{if(armed.delete(k))renderSoon()},4000);return}
    armed.delete(k);
    const sb=getSettings().subs.find(v=>v.id===id),i=subInfo(sb);
    editSettings(s=>{const x=s.subs.find(v=>v.id===id);if(!x)return;
      if(a==='subRenew'){const ns=i.end&&i.left>=0?new Date(i.end.getTime()+864e5):today0();x.since=x.since||x.start;x.start=iso(ns);x.cancelled=''}
      else x.cancelled=iso(i.end&&i.left>=0?i.end:today0())});
    note(a==='subRenew'?`已續約：${sb.name}`:`已安排取消：${sb.name}`);render();return}
  if(['delItem','delCat','delExtra','delEntry','delInc','delSub'].includes(a)){
    const k=a+':'+id;
    if(!armed.has(k)){armed.add(k);render();setTimeout(()=>{if(armed.delete(k))renderSoon()},3500);return}
    armed.delete(k);
    if(a==='delItem')editSettings(s=>{s.items=s.items.filter(i=>i.id!==id)});
    if(a==='delCat')editSettings(s=>{s.categories=s.categories.filter(c=>c.id!==id)});
    if(a==='delInc')editSettings(s=>{s.incomes=s.incomes.filter(c=>c.id!==id)});
    if(a==='delSub'){editSettings(s=>{s.subs=s.subs.filter(c=>c.id!==id)});if(editSub===id)editSub=null}
    if(a==='delExtra')editMonth(planM,m=>{m.extras=m.extras.filter(i=>i.id!==id);delete m.checks[id]});
    if(a==='delEntry')editMonth(revM,m=>{m.entries=m.entries.filter(i=>i.id!==id)});
    render();
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='imp'){const f=t.files[0];if(!f)return;t.value='';f.text().then(x=>{let o;try{o=JSON.parse(x)}catch(err){}
    if(!o||(!o.months&&!o.settings)){note('呢個檔唔係月結簿資料。');return}
    importData(o);render();note('已匯入 '+Object.keys(o.months||{}).length+' 個月嘅資料。')});return}
  const a=t.dataset&&t.dataset.act,id=t.dataset&&t.dataset.id;if(!a)return;
  if(a==='toggle'){const it=monthItems(planM,book).find(i=>i.id===id);if(!it)return;
    editMonth(planM,m=>{const c={...(m.checks[id]||{})};c.done=t.checked;c.amount=+it.amt||0;c.date=t.checked?doneDate(planM,it.day):null;m.checks[id]=c});render();return}
  if(a==='amt'){const v=parseFloat(t.value);if(isNaN(v))return;editMonth(planM,m=>{m.checks[id]={...(m.checks[id]||{}),amount:v}});renderSoon();return}
  if(a==='incToggle'){const it=incomes(planM).find(i=>i.id===id);if(!it)return;
    editMonth(planM,m=>{const c={...(m.inc[id]||{})};c.done=t.checked;c.amount=+it.amt||0;c.date=t.checked?doneDate(planM,it.day):null;m.inc[id]=c});render();return}
  if(a==='incAmt'){const v=parseFloat(t.value);if(isNaN(v))return;editMonth(planM,m=>{m.inc[id]={...(m.inc[id]||{}),amount:v}});renderSoon();return}
  if(a==='alloc'){const v=parseFloat(t.value);if(isNaN(v))return;editMonth(planM,m=>{m.alloc=v});renderSoon();return}
  if(a==='allocDone'){editMonth(planM,m=>{m.allocDone=t.checked;if(m.alloc==null)m.alloc=allocOf(planM)});render();return}
  if(a==='homeAlloc'){editSettings(s=>{s.homeAlloc=parseFloat(t.value)||0});renderSoon();return}
  if(a==='itemF'){const f=t.dataset.f;let v=t.value;if(f==='day')v=Math.max(1,Math.min(31,parseInt(v)||1));if(f==='amount')v=parseFloat(v)||0;
    editSettings(s=>{const i=s.items.find(x=>x.id===id);if(i)i[f]=v});renderSoon();return}
  if(a==='itemOn'){editSettings(s=>{const i=s.items.find(x=>x.id===id);if(i)i.active=t.checked});return}
  if(a==='incF'){const f=t.dataset.f;let v=t.value;if(f==='day')v=Math.max(1,Math.min(31,parseInt(v)||1));if(f==='amount')v=parseFloat(v)||0;if(f==='name')v=v.trim()||'收入';
    editSettings(s=>{const i=s.incomes.find(x=>x.id===id);if(i)i[f]=v});renderSoon();return}
  if(a==='catF'){const f=t.dataset.f;let v=f==='budget'?(parseFloat(t.value)||0):f==='book'?t.value:(t.value.trim()||'未命名');
    editSettings(s=>{const c=s.categories.find(x=>x.id===id);if(c)c[f]=v});renderSoon();return}
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='f-extra'){
    const it={id:'x-'+gid(),name:$('#ex-name').value.trim(),kind:$('#ex-kind').value,day:Math.max(1,Math.min(daysIn(planM),parseInt($('#ex-day').value)||1)),amount:parseFloat($('#ex-amt').value)||0,cat:$('#ex-cat').value,acct:'',book};
    if(!it.name)return;editMonth(planM,m=>m.extras.push(it));render();
  }
  if(e.target.id==='f-entry'){
    const en={id:'e-'+gid(),date:$('#en-date').value||'',type:$('#en-type').value,cat:$('#en-cat').value,desc:$('#en-desc').value.trim(),amount:parseFloat($('#en-amt').value)||0,book};
    if(!en.amount)return;editMonth(revM,m=>m.entries.push(en));render();
  }
  if(e.target.id==='f-sub'){
    const v={name:$('#sb-name').value.trim(),book:$('#sb-book').value,cat:$('#sb-cat').value,amount:parseFloat($('#sb-amt').value)||0,cycle:$('#sb-cycle').value,
      since:$('#sb-since').value,start:$('#sb-start').value||$('#sb-since').value,term:Math.max(0,parseInt($('#sb-term').value)||0),
      notice:Math.max(0,parseInt($('#sb-notice').value)||0),acct:$('#sb-acct').value.trim(),inList:$('#sb-inlist').checked};
    if(!v.name||!v.since)return;
    editSettings(s=>{if(editSub){const x=s.subs.find(y=>y.id===editSub);if(x)Object.assign(x,v)}else s.subs.push({id:'s-'+gid(),cancelled:'',...v})});
    note((editSub?'已更新：':'已加入：')+v.name);editSub=null;render();
  }
});
boot();
})();
</script>
</body>
</html>
